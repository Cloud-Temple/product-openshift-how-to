apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-test
  namespace: poc-helmfile
spec:
  template:
    spec:
      containers:
      - name: postgres-client
        image: postgres:17-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "=========================================="
          echo "  TEST POC PostgreSQL - Validation complète"
          echo "=========================================="
          echo ""

          echo "1. Test de connexion à PostgreSQL..."
          psql -h postgres-demo -U demo -d demo -c "SELECT version();" || exit 1
          echo "✅ Connexion réussie !"
          echo ""

          echo "2. Création d'une table de test..."
          psql -h postgres-demo -U demo -d demo -c "CREATE TABLE IF NOT EXISTS test_poc (id SERIAL PRIMARY KEY, nom VARCHAR(100), valeur INT, date_creation TIMESTAMP DEFAULT CURRENT_TIMESTAMP);" || exit 1
          echo "✅ Table 'test_poc' créée !"
          echo ""

          echo "3. Insertion de données de test..."
          psql -h postgres-demo -U demo -d demo -c "INSERT INTO test_poc (nom, valeur) VALUES ('Test 1', 100), ('Test 2', 200), ('Test 3', 300), ('Test 4', 400), ('Test 5', 500);" || exit 1
          echo "✅ 5 lignes insérées !"
          echo ""

          echo "4. Lecture des données..."
          psql -h postgres-demo -U demo -d demo -c "SELECT * FROM test_poc ORDER BY id;" || exit 1
          echo ""

          echo "5. Test de requêtes SQL (agrégation)..."
          psql -h postgres-demo -U demo -d demo -c "SELECT COUNT(*) as total_lignes, SUM(valeur) as somme_valeurs, AVG(valeur) as moyenne FROM test_poc;" || exit 1
          echo ""

          echo "6. Statistiques de la base de données..."
          psql -h postgres-demo -U demo -d demo -c "SELECT pg_database.datname, pg_size_pretty(pg_database_size(pg_database.datname)) AS size FROM pg_database ORDER BY pg_database_size(pg_database.datname) DESC;" || exit 1
          echo ""

          echo "7. Vérification du stockage (PVC)..."
          psql -h postgres-demo -U demo -d demo -c "SELECT pg_size_pretty(pg_database_size('demo')) AS taille_base_demo;" || exit 1
          echo ""

          echo "8. Test de mise à jour des données..."
          psql -h postgres-demo -U demo -d demo -c "UPDATE test_poc SET valeur = valeur * 2 WHERE id <= 3;" || exit 1
          echo "✅ Mise à jour réussie !"
          echo ""

          echo "9. Vérification des données mises à jour..."
          UPDATED_SUM=$(psql -h postgres-demo -U demo -d demo -t -c "SELECT SUM(valeur) FROM test_poc WHERE id <= 3;" | xargs)
          if [ "$UPDATED_SUM" = "1200" ]; then
            echo "✅ Mise à jour confirmée (somme des valeurs id 1,2,3 = 1200 au lieu de 600) !"
          else
            echo "❌ Problème lors de la vérification de la mise à jour (somme obtenue: $UPDATED_SUM)"
            exit 1
          fi
          psql -h postgres-demo -U demo -d demo -c "SELECT id, nom, valeur FROM test_poc ORDER BY id;" || exit 1
          echo ""

          echo "=========================================="
          echo "  ✅ VALIDATION POC RÉUSSIE !"
          echo "=========================================="
          echo ""
          echo "Résumé :"
          echo "  - Connexion PostgreSQL : OK"
          echo "  - Création de table : OK"
          echo "  - Insertion de données : OK"
          echo "  - Lecture de données : OK"
          echo "  - Requêtes SQL complexes : OK"
          echo "  - Statistiques base de données : OK"
          echo "  - Mise à jour des données : OK"
          echo "  - Stockage PVC fonctionnel : OK"
          echo ""
          echo "PostgreSQL est pleinement opérationnel !"
          echo "=========================================="
        env:
        - name: PGPASSWORD
          value: "demopassword"
      restartPolicy: Never
  backoffLimit: 2
